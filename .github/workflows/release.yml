name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v1.1.0)'
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1 # Only pulls the latest commit, not the whole history

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17' # Match the version required by your Flutter/Gradle version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # printf avoids echo mangling base64; fail if keystore is empty
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          test -s android/app/keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=keystore.jks"
          } > android/key.properties

      - name: Build universal compatibility APK
        run: |
          flutter build apk --release
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/ironvault-${RELEASE_TAG}.apk"

      - name: Build ABI-specific release APKs
        run: flutter build apk --release --split-per-abi

      - name: Stage release APKs for GitHub Release
        run: |
          set -euo pipefail
          DEST_DIR="build/release-assets"
          mkdir -p "${DEST_DIR}"
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            SOURCE="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            DEST="${DEST_DIR}/ironvault-${RELEASE_TAG}-${ABI}.apk"
            test -s "${SOURCE}"
            cp "${SOURCE}" "${DEST}"
          done
          ls -lh "${DEST_DIR}"

      - name: Verify release APKs (package + version + keystore)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK" -path '*/build-tools/*/apksigner' 2>/dev/null | sort -V | tail -1)"
          AAPT="$(find "$SDK" -path '*/build-tools/*/aapt' 2>/dev/null | sort -V | tail -1)"
          for APK in build/release-assets/*.apk; do
            test -s "$APK"
            if test -n "$APKSIGNER" && test -x "$APKSIGNER"; then
              "$APKSIGNER" verify --print-certs "$APK" | head -40
            else
              echo "apksigner not found under SDK; skip cert dump"
            fi
            if test -n "$AAPT" && test -x "$AAPT"; then
              "$AAPT" dump badging "$APK" | head -5
            else
              echo "aapt not found in SDK; skip badging dump"
            fi
          done

      - name: Extract release notes from changelog
        run: |
          awk '
            $0 == "## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' tag="${RELEASE_TAG}" CHANGELOG.md | sed '/./,$!d' > release_notes.md

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: |
            build/release-assets/ironvault-${{ env.RELEASE_TAG }}.apk
            build/release-assets/ironvault-${{ env.RELEASE_TAG }}-armeabi-v7a.apk
            build/release-assets/ironvault-${{ env.RELEASE_TAG }}-arm64-v8a.apk
            build/release-assets/ironvault-${{ env.RELEASE_TAG }}-x86_64.apk
